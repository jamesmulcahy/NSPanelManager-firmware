name: QEMU firmware tests

# Boots the real firmware in Espressif's QEMU fork against a fake manager,
# broker and Nextion display, and drives it with simulated screen input.
# See firmware_espidf/qemu/README.md.

on:
  push:
    # Merges into fork (and any direct push there). A pull request's branch is covered by its
    # pull_request run; a push trigger on every branch ran each check twice.
    branches:
      - "fork"
    paths:
      - "firmware_espidf/**"
      - ".github/workflows/qemu-tests.yml"
  pull_request:
    paths:
      - "firmware_espidf/**"
      - ".github/workflows/qemu-tests.yml"
  workflow_dispatch:

jobs:
  # The QEMU firmware, built once for every test job below.
  build:
    name: build (qemu)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: firmware_espidf
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache PlatformIO toolchains
        uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: qemu-build-${{ runner.os }}-${{ hashFiles('firmware_espidf/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio==6.1.19

      - name: Build the firmware for QEMU
        run: pio run --environment qemu

      - name: Keep the images the tests boot
        uses: actions/upload-artifact@v7
        with:
          name: qemu-firmware
          path: |
            firmware_espidf/.pio/build/qemu/firmware.bin
            firmware_espidf/.pio/build/qemu/firmware.elf
            firmware_espidf/.pio/build/qemu/bootloader.bin
            firmware_espidf/.pio/build/qemu/partitions.bin
            firmware_espidf/.pio/build/qemu/ota_data_initial.bin
          if-no-files-found: error
          retention-days: 3

  qemu:
    name: qemu (${{ matrix.display }})
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # NSPM's own (legacy) TFT (terminal: nextion; unset would mean the LVGL UI). The firmware has no HMI
          # pages, so all it shows there is the legacy screen (test_legacy_tft), until a GUI update installs the
          # terminal TFT: the GUI updates that start on NSPM's TFT (hmi-to-hmi, and hmi-to-terminal, the
          # migration) run here and in gui-updates. test_gui_data checks the names the firmware uses from the
          # HMI, the boot screen's among them. Everything else runs on the terminal display, below.
          - display: legacy-tft
            terminal: nextion
            tests: "test_legacy_tft or test_gui_data or (test_gui_update and not test_gui_update_faults)"
            marks: ""
            timeout: 60
          # The GUI update tests, also on NSPM's TFT. Each flashes the panel and reboots it, often more
          # than once, so they take most of the time and are split two ways to run side by side.
          # GUI updates under faults (every fault the tests inject is handled; a new unhandled one goes in as a strict xfail,
          # with its own job for `-m xfail` added back).
          - display: gui-updates
            terminal: nextion
            tests: "test_gui_update_faults"
            marks: "not xfail"
            timeout: 45
          # The same updates on the terminal TFT (terminal-to-terminal): the happy path and every fault.
          # The migration from NSPM's TFT to the terminal one (hmi-to-terminal) runs in the two legs
          # above, whose display starts on NSPM's TFT.
          - display: gui-updates-terminal
            terminal: us
            tests: "test_gui_update"
            marks: "not xfail"
            timeout: 60
          # An nspanel-terminal TFT: the firmware's LVGL UI against nextion-tools' terminal
          # receiver. The LVGL tests (the UI, the timers, the screensaver cards) and the LVGL variants of the
          # tests of behaviour any UI has (boot, touch, default room, reconnects, page switches, weather).
          - display: terminal-us
            terminal: us
            tests: "test_lvgl_terminal or test_timers or test_screensaver_cards or test_screensaver_energy or test_screensaver_now_playing or test_boot or test_touch or test_default_room or test_mqtt_reconnect or test_page_transitions or test_weather"
            marks: ""
            timeout: 60
          # The rest, which does not depend on the UI (config.json, metrics, the loop watchdog, the web UI and
          # firmware updates, the temperature sensor), and the gestures, on the terminal display as well.
          - display: terminal-us-system
            terminal: us
            tests: "test_config_file or test_heap_metrics or test_loop_watchdog or test_web_ui or test_temperature or test_gestures"
            marks: ""
            timeout: 60
    timeout-minutes: ${{ matrix.timeout }}
    defaults:
      run:
        working-directory: firmware_espidf
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # 3.11 only for gdb's Python scripting (the failure dump); the tests run on 3.12.
          python-version: |
            3.11
            3.12

      - name: Install QEMU runtime libraries and mosquitto
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgcrypt20 libglib2.0-0 libpixman-1-0 libsdl2-2.0-0 libslirp0 zlib1g mosquitto
          # Each test starts its own broker on a random port; the system service is not used.
          sudo systemctl disable --now mosquitto

      - name: Cache the HMI and the .proto files
        uses: actions/cache@v6
        with:
          path: |
            firmware_espidf/qemu/build/hmi
            firmware_espidf/qemu/build/proto
          key: nspm-upstream-${{ hashFiles('firmware_espidf/qemu/nspanelmanager.ref', 'firmware_espidf/qemu/protobuf.ref') }}

      - name: Cache PlatformIO toolchains and QEMU
        uses: actions/cache@v6
        with:
          path: |
            ~/.platformio
            ~/.cache/nspm-qemu
          key: qemu-tests-${{ runner.os }}-${{ hashFiles('firmware_espidf/platformio.ini', 'firmware_espidf/qemu/install_qemu.sh', '.github/workflows/qemu-tests.yml') }}

      - name: Install PlatformIO tools
        run: |
          pip install platformio==6.1.19
          # gdb, for the CPU and task dump a failing test takes of a hung guest.
          pio pkg install --global --tool "espressif/tool-xtensa-esp-elf-gdb@~12.1.0"
          # mklittlefs, which builds each test's LittleFS image (qemu/nspm_qemu/image.py); the version
          # espressif32 7.1.1 itself installs, so its images match the firmware's LittleFS.
          pio pkg install --global --tool "platformio/tool-mklittlefs@~1.203.0"

      - name: Fetch the QEMU firmware
        uses: actions/download-artifact@v7
        with:
          name: qemu-firmware
          path: firmware_espidf/.pio/build/qemu

      - name: Test
        env:
          NSPM_QEMU_SKIP_BUILD: "1"
          NSPM_QEMU_GDB: "1"
          NSPM_QEMU_TERMINAL: ${{ matrix.terminal }}
          TESTS: ${{ matrix.tests }}
          MARKS: ${{ matrix.marks }}
        # An empty -k or -m selects everything.
        run: qemu/run_tests.sh -k "$TESTS" -m "$MARKS"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: qemu-test-logs-${{ matrix.display }}
          path: |
            firmware_espidf/qemu/build/junit.xml
            firmware_espidf/qemu/build/test-logs/
          if-no-files-found: ignore
