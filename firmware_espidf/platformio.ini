; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
extra_scripts = pre:check_no_std_format.py
build_flags =
	-Iinclude
	-Ilib/ProtoBuf

[env:original_sonoff]
platform = espressif32 @ 7.1.1
board = esp32doit-devkit-v1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
build_flags = 
	${env.build_flags}
	-DBOARD_SONOFF

[env:custom_pcb]
platform = espressif32 @ 7.1.1
board = 4d_systems_esp32s3_gen4_r8n16
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
build_flags = 
	${env.build_flags}
	-DBOARD_CUSTOM

; Emulated ESP32 for CI tests under Espressif's QEMU fork (see qemu/README.md).
; Same board and sdkconfig as original_sonoff, plus the overlay in
; qemu/sdkconfig.qemu.defaults; sdkconfig.qemu is generated, not committed.
[env:qemu]
extends = env:original_sonoff
extra_scripts =
	${env.extra_scripts}
	pre:qemu/gen_sdkconfig.py
build_flags =
	${env:original_sonoff.build_flags}
	-DNSPM_QEMU
