; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
extra_scripts =
	pre:check_no_std_format.py
	pre:gen_web_assets.py
build_flags =
	-Iinclude
	-Ilib/ProtoBuf

[env:original_sonoff]
platform = espressif32 @ 7.1.1
board = esp32doit-devkit-v1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions.csv
build_flags = 
	${env.build_flags}
	-DBOARD_SONOFF

; Waveshare ESP32-P4-86-Panel-ETH-2RO (the ESP32-P4-WIFI6-Touch-LCD-4B core on a bottom board with
; Ethernet, RS485 and two relays): ESP32-P4 (rev 3.x) with an ESP32-C6 for Wi-Fi (ESP-Hosted over
; SDIO), 32 MB flash, 32 MB PSRAM, a 720x720 MIPI-DSI display. The stock platform's builder knows no
; ESP32-P4, so this board builds on pioarduino's (ESP-IDF 6.1.1, against 6.1.0 for original_sonoff;
; needs PlatformIO Core 6.2). The model the manager knows it by is still "custom".
[env:custom_pcb]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00/platform-espressif32.zip
board = esp32-p4_r3
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = partitions_p4.csv
board_build.f_cpu = 400000000L
board_upload.flash_size = 32MB
board_upload.maximum_size = 4194304
extra_scripts =
	${env.extra_scripts}
	pre:fix_forced_includes.py
build_flags = 
	${env.build_flags}
	-DBOARD_CUSTOM
	-DNSPM_HD_FONTS
	-DNSPM_HD_ART
	; GET /rec/test.wav, for microphone listening tests and tuning (docs/CUSTOM_PCB.md); off by default
	; -DNSPM_VOICE_TEST_ENDPOINT

; Emulated ESP32 for CI tests under Espressif's QEMU fork (see qemu/README.md).
; Same board and sdkconfig as original_sonoff, plus the overlay in
; qemu/sdkconfig.qemu.defaults; sdkconfig.qemu is generated, not committed.
[env:qemu]
extends = env:original_sonoff
extra_scripts =
	${env.extra_scripts}
	pre:qemu/gen_sdkconfig.py
build_flags =
	${env:original_sonoff.build_flags}
	-DNSPM_QEMU
