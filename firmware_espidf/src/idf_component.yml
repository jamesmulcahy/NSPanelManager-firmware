dependencies:
  espressif/mqtt: "*"
  joltwallet/littlefs: "1.22.3"
  mittelab/nlohmann-json: "3.11.3"
  espp/dns_server: "1.3.3"
  # espp/dns_server asks for its espp dependencies as ">=1.0". Pinned at the versions in
  # dependencies.lock.esp32, so a change to this file that makes the component manager solve again
  # (adding lvgl did) does not also upgrade them.
  espp/base_component: "1.3.3"
  espp/format: "1.3.3"
  espp/logger: "1.3.3"
  espp/socket: "1.3.3"
  espp/task: "1.3.3"
  espp/thread_pool: "1.3.3"
  lvgl/lvgl: "9.6.0"
  # custom_pcb (Waveshare ESP32-P4-WIFI6-Touch-LCD-4B): the P4 has no radio; Wi-Fi is the ESP32-C6's,
  # over SDIO. Pinned at the versions of Waveshare's factory app, which flashes the C6 with
  # ESP-Hosted 3.0.10: the host and the C6's slave firmware must speak the same protocol.
  espressif/esp_hosted:
    version: "3.0.10"
    rules:
      - if: "target == esp32p4"
  espressif/esp_wifi_remote:
    version: "1.6.5"
    rules:
      - if: "target == esp32p4"
  # custom_pcb's display: a 720x720 MIPI-DSI panel, ST7703 or JD9365DA depending on the unit (DsiDisplay
  # probes which), and its GT911 touch controller. The versions of Waveshare's board definition
  # (waveshare/waveshare_boards 0.3.7, esp32_p4_wifi6_touch_lcd_4b).
  waveshare/esp_lcd_st7703:
    version: "2.0.0"
    rules:
      - if: "target == esp32p4"
  espressif/esp_lcd_jd9365:
    version: "2.0.2"
    rules:
      - if: "target == esp32p4"
  espressif/esp_lcd_touch_gt911:
    version: "1.2.1"
    rules:
      - if: "target == esp32p4"
  # custom_pcb's microphones: the ES7210 ADC (lib/VoiceCapture), driven directly, without Waveshare's
  # board manager. 1.6.2, the newest stable release: Waveshare's 2.0.0-beta5 is a beta whose API still
  # changes from one beta to the next (channel_mask's meaning did in beta4), and on the P4 it brings in
  # usb_host_uac too.
  espressif/esp_codec_dev:
    version: "1.6.2"
    rules:
      - if: "target == esp32p4"
  # custom_pcb's microphones: esp-sr's audio front end (2-mic BSS, WebRTC noise suppression) and its GSC
  # beamformer. 2.6.2 builds against ESP-IDF 6.1 (2.5.0 fixed its Kconfig for 6.1) and ships P4 rev 3.x
  # libraries for IDF 6 (lib/esp32p4). Its dependencies are pinned too, at the versions in
  # dependencies.lock.esp32p4.
  espressif/esp-sr:
    version: "2.6.2"
    rules:
      - if: "target == esp32p4"
  espressif/esp-dl:
    version: "3.3.13"
    rules:
      - if: "target == esp32p4"
  espressif/dl_fft:
    version: "0.8.0"
    rules:
      - if: "target == esp32p4"
  espressif/esp_new_jpeg:
    version: "1.0.2"
    rules:
      - if: "target == esp32p4"
  espressif/cjson:
    version: "1.7.19~2"
    rules:
      - if: "target == esp32p4"
